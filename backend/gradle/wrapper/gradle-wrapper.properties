# =============================================================================
# Gradle Wrapper 설정
# -----------------------------------------------------------------------------
# distributionUrl: ./gradlew 실행 시 자동으로 받아오는 Gradle 배포본 위치.
#   - Java 17 + Spring Boot 3.3.x 와 호환되는 8.10 LTS 버전을 고정한다.
#   - 팀원/CI 모두 동일한 Gradle 버전을 쓰도록 강제하기 위해 wrapper 사용이 필수.
# distributionBase / zipStoreBase = GRADLE_USER_HOME
#   - 사용자 홈(~/.gradle) 아래 캐시로 두어 프로젝트 클린해도 재다운로드되지 않게 함.
# =============================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
