# =============================================================================
# Gradle Wrapper 설정
# -----------------------------------------------------------------------------
# distributionUrl: ./gradlew 실행 시 자동으로 받아오는 Gradle 배포본 위치.
#   - Spring Boot 4 Gradle 플러그인이 요구하는 8.14 이상 중 8.14.x 를 고정한다.
#   - 팀원/CI 모두 동일한 Gradle 버전을 쓰도록 강제하기 위해 wrapper 사용이 필수.
# distributionSha256Sum: 내려받은 배포본이 공식 값과 다르면 실행을 멈춘다 (services.gradle.org 의 .sha256).
#   distributionUrl 을 올릴 때 같이 바꿔야 한다.
# distributionBase / zipStoreBase = GRADLE_USER_HOME
#   - 사용자 홈(~/.gradle) 아래 캐시로 두어 프로젝트 클린해도 재다운로드되지 않게 함.
# =============================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.6-bin.zip
distributionSha256Sum=7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
