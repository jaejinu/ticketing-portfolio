# =============================================================================
# Version Catalog — backend 전역 의존성 버전 단일 소스
# -----------------------------------------------------------------------------
# 모든 서브모듈은 build.gradle.kts 에서 libs.* 형태로 이 카탈로그를 참조한다.
# 한곳에서 버전을 올리면 전 모듈에 일관되게 반영되어 휴먼에러를 막는다.
#
# 큰 결정:
#   - Spring Boot 4.1.x: Spring Framework 7 / Jackson 3 / Hibernate 7 라인. Java 17 이상에서 동작.
#     (3.5 라인은 spring-webmvc 보안 패치가 더 나오지 않아 올림 — docs/security-audit.md 참고)
#   - Spring Cloud 2025.1.x: Boot 4 와 함께 사용하는 BOM.
#   - Redisson 4.x: Spring Boot 4 starter 사용 → 좌석 분산락 핵심.
#   - JJWT 0.13.x: 0.11 대비 API가 새로 갈렸으므로 신버전 고정.
#   - Bucket4j 8.10.x: Redis 백엔드(jcache-redis)로 분산 토큰 버킷 → 채널별 알림 quota·레이트리밋.
#   - OpenTelemetry starter 2.32: micrometer-tracing 와 함께 OTLP/HTTP 익스포터 자동 구성.
# =============================================================================

[versions]
java                    = "21"
spring-boot             = "4.1.2"
spring-dependency-mgmt  = "1.1.7"
spring-cloud            = "2025.1.3"
redisson                = "4.8.0"
testcontainers          = "2.0.5"
jjwt                    = "0.13.0"
otel-spring-starter     = "2.32.0"
lombok                  = "1.18.48"
bucket4j                = "8.10.1"
shedlock                = "7.10.1"        # 스케줄러 분산 락 (leader election 대용 — ADR-0004 갱신 참고)
jackson-databind-nullable = "0.2.12"        # OpenAPI 생성기/널 표현 호환
mapstruct               = "1.6.3"

[libraries]
# --- Spring Boot starters (버전은 BOM 으로 관리되므로 module 만 명시) -----------------
spring-boot-starter                 = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc          = { module = "org.springframework.boot:spring-boot-starter-webmvc" }   # Boot 4: starter-web → starter-webmvc
spring-boot-starter-webflux         = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-websocket       = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-security        = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation      = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa        = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis      = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-actuator        = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-mail            = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-test            = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test     = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }   # Boot 4: MockMvc 테스트 자동설정 분리
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# --- Spring Kafka ------------------------------------------------------------
spring-boot-starter-kafka           = { module = "org.springframework.boot:spring-boot-starter-kafka" }    # Boot 4: Kafka 자동설정은 starter 에 있음 (spring-kafka 포함)
spring-kafka-test                   = { module = "org.springframework.kafka:spring-kafka-test" }
kafka-streams                       = { module = "org.apache.kafka:kafka-streams" }

# --- DB / Migration ----------------------------------------------------------
postgresql                          = { module = "org.postgresql:postgresql" }
spring-boot-starter-flyway          = { module = "org.springframework.boot:spring-boot-starter-flyway" }   # Boot 4: Flyway 자동설정은 starter 에 있음 (flyway-core 포함)
flyway-postgresql                   = { module = "org.flywaydb:flyway-database-postgresql" }

# --- Redis / Lock / RateLimit ------------------------------------------------
redisson-spring-boot                = { module = "org.redisson:redisson-spring-boot-starter", version.ref = "redisson" }
shedlock-spring                     = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-provider-redis-spring      = { module = "net.javacrumbs.shedlock:shedlock-provider-redis-spring", version.ref = "shedlock" }
bucket4j-core                       = { module = "com.bucket4j:bucket4j-core", version.ref = "bucket4j" }
bucket4j-redis                      = { module = "com.bucket4j:bucket4j-redis", version.ref = "bucket4j" }

# --- 인증/JWT ------------------------------------------------------------------
jjwt-api                            = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl                           = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson                        = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# --- 관측성 -------------------------------------------------------------------
micrometer-tracing-bridge-otel      = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
micrometer-registry-otlp            = { module = "io.micrometer:micrometer-registry-otlp" }
opentelemetry-spring-starter        = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter", version.ref = "otel-spring-starter" }
# 로그 → OTLP (OtlpLogExportConfig). 스타터가 이미 런타임으로 끌어오는 것과 같은 버전(-alpha).
opentelemetry-logback-appender      = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version = "2.32.0-alpha" }

# --- Lombok / Mapstruct ------------------------------------------------------
lombok                              = { module = "org.projectlombok:lombok",              version.ref = "lombok" }
mapstruct                           = { module = "org.mapstruct:mapstruct",                version.ref = "mapstruct" }
mapstruct-processor                 = { module = "org.mapstruct:mapstruct-processor",      version.ref = "mapstruct" }

# --- Testcontainers ----------------------------------------------------------
testcontainers-bom                  = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit                = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql           = { module = "org.testcontainers:testcontainers-postgresql",    version.ref = "testcontainers" }
testcontainers-kafka                = { module = "org.testcontainers:testcontainers-kafka",         version.ref = "testcontainers" }

# --- 기타 ---------------------------------------------------------------------
jackson-databind-nullable           = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jackson-databind-nullable" }

# Caffeine — in-memory TTL 캐시 (ws-bridge 의 멱등 dedup, alert 의 rate limit 캐시 등)
# 버전은 Spring Boot BOM 이 관리.
caffeine                            = { module = "com.github.ben-manes.caffeine:caffeine" }

[plugins]
spring-boot                 = { id = "org.springframework.boot",                    version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management",            version.ref = "spring-dependency-mgmt" }
