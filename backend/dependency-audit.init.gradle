import groovy.json.JsonOutput

// Export the actual resolved runtime versions, including transitive dependencies.
gradle.projectsEvaluated {
    rootProject.tasks.register('exportAuditDependencies') {
        doLast {
            def coordinates = new TreeSet<String>()
            rootProject.allprojects.each { p ->
                def runtime = p.configurations.findByName('runtimeClasspath')
                if (runtime != null && runtime.canBeResolved) {
                    runtime.incoming.resolutionResult.allComponents.each { c ->
                        if (c.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                            coordinates.add("${c.id.group}:${c.id.module}:${c.id.version}".toString())
                        }
                    }
                }
            }
            def output = new File(rootProject.layout.buildDirectory.get().asFile, 'audit/runtime-dependencies.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(coordinates.collect { coordinate ->
                def parts = coordinate.split(':')
                [package: [ecosystem: 'Maven', name: "${parts[0]}:${parts[1]}"], version: parts[2]]
            }))
            println "Exported ${coordinates.size()} runtime dependencies to ${output}"
        }
    }
}
