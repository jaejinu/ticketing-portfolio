# =============================================================================
# Tempo — 분산 트레이스 저장소 (single-binary)
# -----------------------------------------------------------------------------
# OTel Collector가 OTLP gRPC로 push → Tempo에서 trace_id로 조회.
# =============================================================================

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

# Tempo 3 monolithic mode: no Kafka dependency; live-store replaces ingester.
target: all

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: ticketing-local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 24h
    metrics_generator:
      processors: [service-graphs, span-metrics]
