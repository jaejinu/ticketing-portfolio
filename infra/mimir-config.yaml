# =============================================================================
# Mimir — Prometheus 호환 메트릭 저장소 (monolithic)
# -----------------------------------------------------------------------------
# 단일 바이너리 모드. 운영은 microservices 모드 + S3 권장.
# =============================================================================

target: all,alertmanager,overrides-exporter

multitenancy_enabled: false

# Retain the single-node classic architecture; no observability Kafka dependency.
ingest_storage:
  enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir

blocks_storage:
  storage_prefix: blocks
  filesystem:
    dir: /data/mimir/blocks
  bucket_store:
    sync_dir: /data/mimir/tsdb-sync
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  push_grpc_method_enabled: true
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/ruler

store_gateway:
  sharding_ring:
    replication_factor: 1

alertmanager:
  data_dir: /data/mimir/alertmanager-data
  external_url: http://localhost:9009/alertmanager

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/alertmanager-store

limits:
  ingestion_rate: 100000
  out_of_order_time_window: 5m
