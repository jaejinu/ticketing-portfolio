# =============================================================================
# ticketing-backend 기본 values
# -----------------------------------------------------------------------------
# 기본값만으로 k3d + 호스트 docker-compose 인프라 조합에서 그대로 뜬다.
# 환경별 오버라이드는 infra/k3d/helm-values.yaml (bootstrap.sh 가 -f 로 전달).
# =============================================================================

image:
  # bootstrap.sh 가 `k3d image import` 로 노드에 직접 밀어넣는 로컬 이미지.
  repository: ticketing/backend
  tag: dev
  # 로컬 import 이미지는 레지스트리에 없으므로 Never/IfNotPresent 여야 한다
  # (Always 면 pull 시도 → ImagePullBackOff).
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# 왜 기본 1 replica 인가:
#   QueueAdmissionScheduler / PricingScheduler / OutboxPublisher 가 아직
#   leader election 없이 인스턴스마다 돈다. N개로 늘리면 admit-rate·틱이 N배가
#   된다 (기능은 동작하나 수치가 왜곡). 멀티 레플리카는 ShedLock/Redisson
#   leader election 도입 후에 — README "남은 일" 참고.
# -----------------------------------------------------------------------------
replicaCount: 1

containerPort: 8080

# Spring 환경으로 그대로 주입되는 env — application-local.yml 의 ${ENV:default} 키들.
# host.k3d.internal = k3d 컨테이너에서 호스트 머신으로 가는 고정 DNS.
env:
  SPRING_PROFILES_ACTIVE: local
  # application.yml 기본 포트는 8088(호스트 포트 사정) — 컨테이너 안에선 표준 8080 사용.
  SERVER_PORT: "8080"
  DB_URL: jdbc:postgresql://host.k3d.internal:5440/ticketing
  REDIS_HOST: host.k3d.internal
  REDIS_PORT: "6390"
  # 9096 = docker-compose kafka 의 K3D 전용 리스너 (advertised host.k3d.internal:9096).
  # 9092(EXTERNAL, advertised localhost)를 쓰면 pod 안에서 localhost 로 풀려 즉사한다.
  KAFKA_BOOTSTRAP: host.k3d.internal:9096
  SMTP_HOST: host.k3d.internal
  SMTP_PORT: "1025"
  ALERT_FCM_URL: http://host.k3d.internal:8086/v1/projects/ticketing-dev/messages:send
  MOCK_PG_BASE_URL: http://host.k3d.internal:8087
  OTEL_EXPORTER_OTLP_ENDPOINT: http://host.k3d.internal:4318
  # 컨테이너 파일시스템에 키 파일이 없으므로 부팅 시 자동 생성 (데모 한정).
  JWT_AUTO_GENERATE: "true"
  JWT_PRIVATE_KEY_PATH: /tmp/jwt-private.pem
  JWT_PUBLIC_KEY_PATH: /tmp/jwt-public.pem

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1536Mi

# /health 는 permitAll (SecurityConfig) — 프로브 인증 불필요.
probes:
  readiness:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 5
    failureThreshold: 12
  liveness:
    path: /health
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 6

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  # k3d LB 가 호스트 18080→80 매핑 — http://ticketing.localhost:18080 으로 접근.
  host: ticketing.localhost
