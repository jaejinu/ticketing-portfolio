# 동시 가동 2분간 같은 구역 0.5초 내 이중 틱 0건, 틱 상한 준수).
#
# 예:
# replicaCount: 2
# env:
#   DB_URL: jdbc:postgresql://host.k3d.internal:5433/ticketing
