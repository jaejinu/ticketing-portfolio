name: Public demo monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-demo-monitor
  cancel-in-progress: false
jobs:
  readiness:
    if: github.repository == 'jaejinu/ticketing-portfolio'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check frontend and backend catalog
        run: |
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 5 \
            https://ticketing-demo-five.vercel.app/ -o /dev/null
          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 \
            https://ticketing-demo-five.vercel.app/api/health | jq -e '.status == "ok"'
