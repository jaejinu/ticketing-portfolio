name: Operations safety
on:
  pull_request:
    paths: ['scripts/demo-*.py', 'scripts/public-demo.py', 'scripts/test_demo_backup.py', '.github/workflows/operations.yml']
  push:
    branches: [main]
    paths: ['scripts/demo-*.py', 'scripts/public-demo.py', 'scripts/test_demo_backup.py', '.github/workflows/operations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Backup guardrails (no service or credentials required)
        run: python3 -m unittest discover -s scripts -p 'test_demo_backup.py' -v
