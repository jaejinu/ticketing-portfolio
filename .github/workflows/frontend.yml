name: Frontend quality

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Browser tests mock these endpoints; no backend or credentials are required.
      NEXT_PUBLIC_API_BASE: http://localhost:8088/api/v1
      NEXT_PUBLIC_WS_BASE: ws://localhost:8088/ws
      INTERNAL_API_BASE: http://localhost:8088/api/v1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Check braces depth mitigation
        run: node scripts/check-braces-guard.mjs
      - name: Lint
        run: pnpm lint
      - name: Build production app and route types
        run: pnpm build
      - name: Check readiness success, errors and recovery
        run: node scripts/check-health.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Upload browser report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-browser-report-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
