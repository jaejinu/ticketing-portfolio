name: Frontend quality

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Browser tests mock these endpoints; no backend or credentials are required.
      NEXT_PUBLIC_API_BASE: http://localhost:8088/api/v1
      NEXT_PUBLIC_WS_BASE: ws://localhost:8088/ws
      INTERNAL_API_BASE: http://localhost:8088/api/v1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: Build production app and route types
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Upload browser report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-browser-report-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
