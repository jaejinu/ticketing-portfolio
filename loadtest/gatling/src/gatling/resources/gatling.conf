###############################################################################
# Gatling 런타임 설정 — 프로젝트별 override
# -----------------------------------------------------------------------------
# Gatling 본체의 기본 gatling-defaults.conf 에 머지된다. (HOCON 포맷)
# https://gatling.io/docs/gatling/reference/current/general/configuration/
#
# 여기서는 포트폴리오 부하 시나리오에 맞춰 최소 키만 잡는다.
###############################################################################

gatling {
  core {
    # 리포트가 들어갈 디렉터리(build/reports/gatling/ 아래로 추가됨).
    # 빈 문자열로 두면 시뮬레이션 이름 그대로 사용.
    outputDirectoryBaseName = ""

    # 시뮬레이션 시작 직후 카운트다운(초). 0 이면 즉시 시작.
    runDescription = "ticketing-portfolio"
  }

  http {
    # SSL 핸드셰이크 타임아웃. 로컬 HTTP 만 쓰면 의미 없지만,
    # k3d Ingress(https) 로 붙을 때를 대비.
    ssl {
      useOpenSsl = true
    }

    # 응답 본문 캐싱은 비활성 — 부하 테스트의 메모리 안정성을 우선.
    pooledConnectionIdleTimeout = 60000
  }

  data {
    # 결과 writers — 기본값(console + file) 그대로 둔다.
    # writers = [console, file]
  }
}
